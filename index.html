
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Universe 2.0</title>

    <!-- Elegant Title Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="universe">

        <!-- Navigation Bar -->
        <header class="navbar">

            <a href="index.html" class="logo">
                <span class="logo-icon">🪐</span>
                <span class="logo-text">My Universe 2.0</span>
            </a>

            <a href="about.html" class="about-link">
                About <span>↗</span>
            </a>

        </header>

        <!-- Homepage Content -->
        <main class="hero">

            <!-- Small Heading -->
            <p class="eyebrow">
                <span>EXPLORE</span>
                <span class="separator">✦</span>
                <span>LEARN</span>
                <span class="separator">✦</span>
                <span>DISCOVER</span>
            </p>

            <!-- Main Title -->
            <h1 class="main-title">
                <span class="title-name">My Universe</span>

                <span class="title-version">
                    2.0
                    <span class="orbit-star">✦</span>
                </span>
            </h1>

            <!-- Tagline -->
            <h2 class="subtitle">
                Eight planets.
                <span class="wonder-text">Endless wonders.</span>
            </h2>

            <!-- Description -->
            <p class="description">
                Step into the Solar System and explore the secrets
                of our cosmic home.
            </p>

            <!-- Explore Button -->
            <a href="explore.html" class="get-started">

                <span class="planet-icon">🪐</span>

                <span>Explore</span>

                <span class="arrow">→</span>

            </a>

            <!-- Bottom Text Without Arrow -->
            <div class="scroll-indicator">
                <p>YOUR JOURNEY AWAITS</p>
            </div>

        </main>

    </div>

</body>
</html>
